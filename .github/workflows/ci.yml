name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Python syntax
        run: python3 -m compileall -q gitaudit.py tests
